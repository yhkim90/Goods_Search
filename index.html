<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <script>
    if (location.pathname === "/Goods_Search") {
      location.replace("/Goods_Search/" + location.search + location.hash);
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SP WATCH">
  <meta name="description" content="SP-800A / SP-800 매물과 할인 모니터링">
  <title>SP WATCH</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="brand">SP WATCH</p>
      <form class="search-form" id="search-form" role="search">
        <label class="sr-only" for="product-query">상품명</label>
        <input id="product-query" class="search-input" type="search" name="q" placeholder="상품명 검색" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false">
      </form>
      <div class="toolbar">
        <button type="button" id="refresh-btn" class="refresh-btn">새로고침</button>
        <p class="checked" id="last-check">-</p>
      </div>
      <p class="refresh-note" id="refresh-note"></p>
    </header>

    <section id="alert-stack" class="stack"></section>

    <section id="price-stack" class="stack"></section>

    <section id="daangn-stack"></section>

    <section class="summary" id="summary">
      <div><span id="count-new">0</span><small>최근 매물</small></div>
      <div><span id="count-drop">0</span><small>가격인하</small></div>
      <div><span id="count-sale">0</span><small>할인판매</small></div>
    </section>

    <footer class="status">
      <p class="status-title">마지막 검색</p>
      <p class="status-time" id="status-time">-</p>
      <ul id="collector-list"></ul>
    </footer>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
