<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <script>
    if (location.pathname === "/Goods_Search") {
      location.replace("/Goods_Search/" + location.search + location.hash);
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Goods Search">
  <meta name="description" content="상품 최저가 5곳과 당근 매물, 업체 신뢰도 검색">
  <title>Goods Search</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css?v=26">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="topbar">
        <p class="brand">GOODS SEARCH</p>
        <button type="button" id="refresh-btn" class="refresh-btn">새로 고침</button>
      </div>
      <form class="search-form" id="search-form" role="search">
        <label class="sr-only" for="product-query">상품명</label>
        <input id="product-query" class="search-input" type="search" name="q" placeholder="상품명 입력" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="submit" id="search-btn" class="search-btn">검색</button>
      </form>
      <p class="last-search" id="last-search">마지막 검색 : - / -</p>
      <p class="refresh-note" id="refresh-note"></p>
    </header>

    <nav class="tabs" id="result-tabs" hidden>
      <button type="button" class="tab is-on" data-tab="shop">신품</button>
      <button type="button" class="tab" data-tab="used">당근</button>
    </nav>
    <section id="shop-panel" class="stack"></section>
    <section id="used-panel" class="stack" hidden></section>

    <footer class="status">
      <ul id="source-list"></ul>
    </footer>
  </main>
  <script src="js/engine.js?v=26"></script>
  <script src="js/app.js?v=26"></script>
</body>
</html>
